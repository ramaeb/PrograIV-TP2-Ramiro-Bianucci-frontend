<section>
  <div class="container py-5 vh-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-2-strong" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <h3 class="mb-5">Loguearse</h3>
            <form #loginForm="ngForm">
              <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="typeEmailX-2">Email</label>
                <input type="email" id="typeEmailX-2" class="form-control form-control-lg" [(ngModel)]="email" name="email"
                required email #emailRef="ngModel" class="form-control" [class.is-invalid]="emailRef.invalid && emailRef.dirty">
              </div>

              <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="typePasswordX-2">Password</label>
                <input type="password" id="typePasswordX-2" class="form-control form-control-lg" [(ngModel)]="clave" name="clave" required #claveRef="ngModel" class="form-control" 
                [class.is-invalid]="claveRef.invalid && claveRef.dirty">
              </div>
            </form>
            
            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit" style="margin: 10px" (click)="logearse()" [disabled]="loginForm.invalid" >Login</button>
            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit" style="margin: 10px; color: crimson;" (click)="logearseComun()" >Login Rapido Comun</button>
            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="submit" style="margin: 10px; color: crimson;" (click)="logearseAdmin()" >Login Rapido Admin</button>
            <p style="color: black;">No tenes cuenta?</p>
            <a class="btn btn-success btn-block btn-lg gradient-custom-4 text-body " href="/registro">Registrate</a>

            <hr class="my-4">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
