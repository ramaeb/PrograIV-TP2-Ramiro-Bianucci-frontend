<section class="vh-100" >
  <div class="mask d-flex align-items-center h-100 gradient-custom-3">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-6">
          <div class="card" style="border-radius: 15px;">
            <div class="card-body p-5">
              <h2 class="text-uppercase text-center mb-5">CREAR UNA CUENTA</h2>

              <form #formRegistro="ngForm">
                <!-- NOMBRE -->
                <div class="form-outline mb-4">
                  <label class="form-label">Nombre</label>
                  <input type="text" name="nombre" [(ngModel)]="nuevoUsuario.nombre"
                         required minlength="3" pattern="^[a-zA-ZÀ-ÿ]+$" #nomRef="ngModel"
                         class="form-control form-control-lg" 
                         [class.is-invalid]="nomRef.invalid && nomRef.dirty" />
                          <div class="invalid-feedback" *ngIf="nomRef.invalid && nomRef.dirty">
                            <p *ngIf="nomRef.errors?.['pattern']">No se permiten números ni símbolos.</p>
                            <p *ngIf="nomRef.errors?.['minlength']">Mínimo 3 caracteres.</p>
                          </div>
                </div>
                         

                <!-- APELLIDO -->
                <div class="form-outline mb-4">
                  <label class="form-label">Apellido</label>
                  <input type="text" name="apellido" [(ngModel)]="nuevoUsuario.apellido" 
                         required minlength="3" pattern="^[a-zA-ZÀ-ÿ]+$" #apeRef="ngModel"
                         class="form-control form-control-lg" 
                         [class.is-invalid]="apeRef.invalid && apeRef.dirty" />
                          <div class="invalid-feedback" *ngIf="apeRef.invalid && apeRef.dirty">
                            <p *ngIf="apeRef.errors?.['pattern']">No se permiten números ni símbolos.</p>
                            <p *ngIf="apeRef.errors?.['minlength']">Mínimo 3 caracteres.</p>
                          </div>
                </div>

                <!-- EDAD -->
                <div class="form-outline mb-4">
                  <label class="form-label">Edad</label>
                  <input type="number" name="edad" [(ngModel)]="nuevoUsuario.edad" 
                         required min="18" #edadRef="ngModel"
                         class="form-control form-control-lg" 
                         [class.is-invalid]="edadRef.invalid && edadRef.dirty" />
                         <div class="invalid-feedback" *ngIf="edadRef.invalid && edadRef.dirty">
                            <p *ngIf="edadRef.errors?.['min']">La edad debe ser mayor o igual a 18 CRECÉ!.</p>
                         </div>
                </div>

                <!-- EMAIL -->  
                <div class="form-outline mb-4">
                  <label class="form-label">Email</label>
                  <input type="email" name="email" [(ngModel)]="nuevoUsuario.email" 
                         required email #emailRef="ngModel"
                         class="form-control form-control-lg" 
                         [class.is-invalid]="emailRef.invalid && emailRef.dirty" />
                </div>

                <!-- CONTRASEÑA -->
                <div class="form-outline mb-4">
                  <label class="form-label">Contraseña</label>
                  <input type="password" name="clave" [(ngModel)]="clave" 
                         required minlength="6" #passRef="ngModel"
                         class="form-control form-control-lg" 
                         [class.is-invalid]="passRef.invalid && passRef.dirty" />
                </div>

                <!-- REPETIR CONTRASEÑA -->
                <div class="form-outline mb-4">
                  <label class="form-label">Repetir Contraseña</label>
                  <input type="password" name="repetirClave" [(ngModel)]="repetirClave" 
                         required class="form-control form-control-lg" 
                         [class.is-invalid]="(repetirClave !== clave) && repetirClave.length > 0" />
                </div>

                <div class="d-flex justify-content-center">
                  <button type="button" 
                    [disabled]="formRegistro.invalid || clave !== repetirClave"
                    class="btn btn-success btn-block btn-lg gradient-custom-4 text-body" 
                    (click)="registrar()">Registrarse!</button>
                </div>

                <p class="text-center text-muted mt-5 mb-0">Ya tenes cuenta :D ? <a href="/login"
                    class="fw-bold text-body"><u>Entrá acá nene!!</u></a></p>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
